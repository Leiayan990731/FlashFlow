apiVersion: v1
kind: ConfigMap
metadata:
  name: flashflow-config
  namespace: flashflow
data:
  LOG_LEVEL: info
  HTTP_ADDR: :8080
  ADMIN_ADDR: :9090
  SHUTDOWN_TIMEOUT: 20s
  HTTP_MAX_BODY_BYTES: "1048576"
  HTTP_MAX_IN_FLIGHT: "2000"
  HTTP_REQUEST_TIMEOUT: 3s
  RATE_LIMIT_PER_SECOND: "20"
  RATE_LIMIT_BURST: "40"
  REDIS_ADDRS: flashflow-redis:26379
  REDIS_MASTER_NAME: flashflow
  REDIS_POOL_SIZE: "200"
  REDIS_MIN_IDLE_CONNS: "20"
  REDIS_DIAL_TIMEOUT: 2s
  REDIS_OPERATION_TIMEOUT: 800ms
  REDIS_WAIT_REPLICAS: "1"
  REDIS_WAIT_TIMEOUT: 500ms
  REDIS_STREAM: flashflow:orders
  REDIS_STREAM_GROUP: order-relays
  REDIS_STREAM_MAX_LEN: "0"
  RESERVATION_TTL: 720h
  ORDER_CACHE_TTL: 24h
  IDEMPOTENCY_TTL: 24h
  KAFKA_BROKERS: flashflow-kafka:9092
  KAFKA_ORDER_TOPIC: flashflow.order.requested
  KAFKA_DLQ_TOPIC: flashflow.order.dlq
  KAFKA_CLIENT_ID: flashflow
  KAFKA_PUBLISH_TIMEOUT: 5s
  KAFKA_MAX_BYTES: "10485760"
  POSTGRES_MAX_CONNS: "10"
  POSTGRES_MIN_CONNS: "1"
  POSTGRES_CONNECT_TIMEOUT: 5s
  RELAY_CONCURRENCY: "8"
  RELAY_BATCH_SIZE: "100"
  RELAY_BLOCK: 1s
  RELAY_CLAIM_IDLE: 60s
  WORKER_CONCURRENCY: "4"
  WORKER_MAX_PROCESS_ATTEMPTS: "8"
  WORKER_RETRY_BASE: 100ms
  WORKER_RETRY_MAX: 10s
  KAFKA_CONSUMER_GROUP: order-workers
