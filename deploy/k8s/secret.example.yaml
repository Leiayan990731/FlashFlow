# Copy to secret.yaml, replace every value, then apply it before kustomize.
apiVersion: v1
kind: Secret
metadata:
  name: flashflow-secrets
  namespace: flashflow
type: Opaque
stringData:
  POSTGRES_URL: postgres://flashflow:CHANGE_ME@flashflow-postgresql-ha-pgpool:5432/flashflow?sslmode=disable
  REDIS_PASSWORD: CHANGE_ME
  REDIS_SENTINEL_PASSWORD: CHANGE_ME
