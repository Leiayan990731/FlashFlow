apiVersion: batch/v1
kind: Job
metadata:
  name: flashflow-migrator
  namespace: flashflow
  labels:
    app.kubernetes.io/name: migrator
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrator
    spec:
      serviceAccountName: flashflow
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: ghcr.io/example/flashflow:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/app/migrator"]
          envFrom:
            - configMapRef:
                name: flashflow-config
            - secretRef:
                name: flashflow-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
