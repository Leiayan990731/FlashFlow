# Replace all values before applying. The application REDIS_PASSWORD and
# POSTGRES_URL must contain the same redis-password and password values.
apiVersion: v1
kind: Secret
metadata:
  name: flashflow-middleware-secrets
  namespace: flashflow
type: Opaque
stringData:
  redis-password: CHANGE_ME
  password: CHANGE_ME
  postgres-password: CHANGE_ME
  repmgr-password: CHANGE_ME
  admin-password: CHANGE_ME
